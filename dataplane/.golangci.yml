# .golangci.yml
version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
    - staticcheck
    - gosec
    - govet
    - errcheck
    - ineffassign
  exclusions:
    paths:
      - '(.+)_test\.go'


