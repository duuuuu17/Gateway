---
backends: # backends将被创建在configmap的data部分
  - name: openai-qwen
    capability:
      models: ["qwen", "qwen2.5"]
      protocols: ["openai"]
      endpoints:
        - "http://172.18.0.3:32337"
        - "http://172.18.0.3:32337"
      streaming: true
    routing:
      weight: 10
      priority: 100
      canary:
        ratio: 0.5 # 使用string类型，后续通过strconv进行转换为float
      strategy: round_robin
