apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway-deployment
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/duuuuu17/Gateway.git' # 你的仓库
        revision: master
        directories:
          - path: k8s/llm-router-chart # 你的 Helm Chart 路径
  template:
    metadata:
      name: 'llm-gateway'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/duuuuu17/Gateway.git'
        targetRevision: master
        path: deploy/llm-router-chart
        helm:
          # 可以在这里覆盖你 Chart 里的 values
          values: |
            operator:
              image:
                repository: registry.cn-shenzhen.aliyuncs.com/xxx/operator
                tag: latest
            dataPlane:
              image:
                repository: registry.cn-shenzhen.aliyuncs.com/xxx/router
                tag: latest
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: default
      syncPolicy:
        automated:
          prune: true       # 如果在 Git 里删了资源，集群里也删
          selfHeal: true    # 如果有人手动改了集群资源，自动恢复成 Git 的状态
        syncOptions:
          - CreateNamespace=true