name: Build and Push to ACR

on:
  push:
    branches: [ master ]

permissions:
  id-token: write   # 必须打开，才能请求 OIDC token
  contents: read

jobs:
  # === Job 1: lint & fmt ===
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [operator, dataplane]
    steps:          
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          working-directory: ${{ matrix.directory }}
          
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.directory }}

      - name: Check go fmt
        working-directory: ${{ matrix.directory }}
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted in ${{ matrix.directory }}. Please run 'go fmt'."
            exit 1
          fi

      - name: Run go vet
        working-directory: ${{ matrix.directory }}
        run: go vet ./...
  # === Job 2: 单元测试 (并行执行) ===
  test:
    name: Unit Tests (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [operator, dataplane]
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          working-directory: ${{ matrix.directory }}

      - name: Run Test
        working-directory: ${{ matrix.directory }}
        run: |
          if [ "${{ matrix.directory }}" = "operator" ]; then
            make test
          else
            go test -v -race -coverprofile=coverage.out ./...
          fi
# === Job 3: build scan & push image 
  build-scan-push:
    name: Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [lint, test] # 核心逻辑：需要 lint 和 test 都成功后才执行
    permissions:
      id-token: write   # 必须打开，才能请求 OIDC token
      contents: read
    strategy:
      matrix:
        directory: [operator, dataplane]
    env:
      ACR_REGISTRY: registry.${{ vars.ACR_REGION }}.aliyuncs.com 

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set short git commit SHA
        run: |
          caculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHA_SHORT=$caculatedSha" >> $GITHUB_ENV

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image (Locally)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.directory }}
          file: ./${{ matrix.directory }}/Dockerfile
          push: false
          tags: ${{ vars.ACR_NEWVERSION_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ matrix.directory }}:${{ env.COMMIT_SHA_SHORT }}
          outputs: type=docker,dest=/tmp/${{ matrix.directory }}.tar # 导出镜像文件供Trivy使用

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/${{ matrix.directory }}.tar # 扫描刚才导出的镜像
          format: 'table'
          exit-code: '1' # 发现漏洞则失败
          severity: 'CRITICAL,HIGH' # 只关注高危和严重漏洞

      - name: Load image back to Docker
        run: docker load -i /tmp/${{ matrix.directory }}.tar

      # docker login（用户名就是临时用户名，密码就是 AuthorizationToken）
      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_NEWVERSION_REGISTRY }}
          username: "${{ secrets.REGISTRY_USERNAME }}"
          password: "${{ secrets.REGISTRY_PASSWORD }}"

      - name: push image

        run: |
          docker push ${{ vars.ACR_NEWVERSION_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ matrix.directory }}:${{ env.COMMIT_SHA_SHORT }}
      
      - name: Update Helm values.yaml with new image tag
        run: |
          # 安装 yq 命令
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

          # 修改 k8s/helm/values.yaml 中的镜像 tag (根据你的实际层级调整路径)
          yq -i ".control-plane.image.tag = \"${{ env.COMMIT_SHA_SHORT }}\"" k8s/helm/gateway-umbrella/values.yaml
          yq -i ".dataPlane.image.tag = \"${{ env.COMMIT_SHA_SHORT }}\"" k8s/helm/gateway-umbrella/values.yaml

          # 配置Git
          git config --global user.name "github-actions[bot]-repo-gateway"
          git config --global user.email "duuuuu17@example.com"
          
          # 提交并推送
          git add k8s/gateway-umbrella/helm/values.yaml
          git commit -m "chore: update image tag to ${COMMIT_SHA_SHORT} [skip ci]"
          git push