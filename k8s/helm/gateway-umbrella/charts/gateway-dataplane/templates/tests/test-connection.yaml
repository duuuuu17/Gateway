apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gateway-dataplane.fullname" . }}-test-connection"
  labels:
    {{- include "gateway-dataplane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "gateway-dataplane.fullname" . }}:8081/healthz']
  restartPolicy: Never
