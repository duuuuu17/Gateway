apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  namespace: default
  labels:
    app: llm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-router
  template:
    metadata:
      labels:
        app: llm-router
      annotations:
        # 自动被 Prometheus 发现
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: llm-router
        image: crpi-jok0hxci4hqtytw8.cn-shenzhen.personal.cr.aliyuncs.com/djy-repository/gateway-dataplane:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        # 注入控制面 Operator 的 Service 地址 (假设你的 Operator 暴露了名为 llm-router-operator 的 Service)
        - name: CONTROL_PLANE_ENDPOINT
          value: "operator-llm-router-operator.operator-system.svc.cluster.local:50051"
        # 注入 Jaeger Collector 的 OTLP gRPC 地址
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "jaeger-collector.istio-system.svc.cluster.local:4317"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-router
  namespace: default
  labels:
    app: llm-router
spec:
  # 对于本地 Kind 测试，建议使用 NodePort，方便你在宿主机用 curl 测试
  # 生产环境通常使用 ClusterIP，由 Ingress Gateway 转发流量进来
  type: NodePort # ClusterIP
  selector:
    app: llm-router
  ports:
    # 1. 业务 HTTP 流量端口
    - name: http
      port: 8080       # Service 的虚拟 IP 访问端口
      targetPort: 8080 # Pod 的 containerPort
      nodePort: 30080 # 可选：如果不想让 Kind 自动分配，可以指定 30000-32767 之间的端口
      protocol: TCP
    
    # 2. Metrics 抓取端口, 仅限port-forward测试使用. 生产部署不需要该port
    - name: metrics
      port: 9090
      targetPort: 9090
      nodePort: 30090 # 可选
      protocol: TCP