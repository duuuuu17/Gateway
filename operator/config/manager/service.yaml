apiVersion: v1
kind: Service
metadata:
  name: llm-router-operator
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  # 控制面只需集群内部访问，使用 ClusterIP 即可
  type: ClusterIP
  selector:
    control-plane: controller-manager
  ports:
    - name: grpc-xds
      port: 50051
      targetPort: 50051
      protocol: TCP