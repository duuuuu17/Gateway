---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-config-llm-router-example-io-v1alpha1-llmrouterconfig
  failurePolicy: Fail
  name: mllmrouterconfig-v1alpha1.kb.io
  rules:
  - apiGroups:
    - config.llm-router.example.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - llmrouterconfigs
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-config-llm-router-example-io-v1alpha1-llmrouterconfig
  failurePolicy: Fail
  name: vllmrouterconfig-v1alpha1.kb.io
  rules:
  - apiGroups:
    - config.llm-router.example.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - llmrouterconfigs
  sideEffects: None
