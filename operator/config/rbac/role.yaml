---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - config.llm-router.example.io
  resources:
  - llmrouterconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.llm-router.example.io
  resources:
  - llmrouterconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - config.llm-router.example.io
  resources:
  - llmrouterconfigs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tenant.llm-router.example.io
  resources:
  - tenantpipelines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tenant.llm-router.example.io
  resources:
  - tenantpipelines/finalizers
  verbs:
  - update
- apiGroups:
  - tenant.llm-router.example.io
  resources:
  - tenantpipelines/status
  verbs:
  - get
  - patch
  - update
