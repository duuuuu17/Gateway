metadata:
  annotations:
    cert-manager.io/inject-ca-from: operator-system/operator-serving-cert
  name: operator-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: operator-webhook-service
      namespace: operator-system
      path: /validate-config-llm-router-example-io-v1alpha1-llmrouterconfig
  failurePolicy: Fail
  name: vllmrouterconfig-v1alpha1.kb.io
  rules:
  - apiGroups:
    - config.llm-router.example.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - llmrouterconfigs
  sideEffects: None
